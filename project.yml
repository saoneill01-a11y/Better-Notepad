name: BetterNotepad
options:
  bundleIdPrefix: com.csioly
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.5.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  BetterNotepad:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
      - package: Markdown
    sources:
      - path: BetterNotepad
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: Better Notepad
        PRODUCT_BUNDLE_IDENTIFIER: com.csioly.betternotepad
        INFOPLIST_FILE: BetterNotepad/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          # Distributed builds: Developer ID + hardened runtime + secure timestamp,
          # which is what notarization requires.
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: Z6U97H9M93
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Xcode otherwise adds get-task-allow (debugger attach), which notarization rejects.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
schemes:
  BetterNotepad:
    build:
      targets:
        BetterNotepad: all
    run:
      config: Debug
    archive:
      config: Release
